[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microcode"
version = "0.1.0"
description = "Unified IaC platform: skillkit + loki-mode + microsandbox, configured in one place."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "microcode" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
microcode = "microcode.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/microcode"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
