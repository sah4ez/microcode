<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <h1>Todos</h1>

    <!-- Cabinet (ЛК) selector: dropdown lists all cabinets; switching reloads
         todos for the selected cabinet via the x-lk-id header. -->
    <section class="card cabinet-card">
      <label for="lk-select" class="cabinet-label">Личный кабинет</label>
      <select id="lk-select"></select>
      <!-- Create a new cabinet inline -->
      <form id="lk-create-form" class="lk-create">
        <input id="lk-name" name="name" type="text" placeholder="New cabinet name" autocomplete="off" required />
        <button type="submit" class="secondary">Add cabinet</button>
      </form>
    </section>

    <!-- Separate cabinet management interface: list all cabinets with rename/delete -->
    <section class="cabinet-management" id="cabinet-management">
      <h2>Manage cabinets (ЛК)</h2>
      <ul id="cabinet-mgmt-list" class="cabinet-management-list" aria-live="polite"></ul>
    </section>

    <!-- Create form: title required, description optional. Sent under the active
         cabinet's x-lk-id. -->
    <form id="create-form" class="card">
      <input id="title" name="title" type="text" placeholder="Title (required)" autocomplete="off" required />
      <input id="description" name="description" type="text" placeholder="Description (optional)" autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <p id="error" class="error" hidden></p>

    <!-- Todo list (scoped to the active cabinet) -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <!-- Logout button -->
    <button id="logout-btn" class="logout-btn secondary">Sign Out</button>
  </main>

  <script src="/app.js"></script>
</body>

</html>
