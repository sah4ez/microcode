# microcode — пример: cline + несколько skill-провайдеров внутри VM.
#
# Один манифест декларативно описывает:
#   1. НАВЫКИ из РАЗНЫХ источников (obra/superpowers с GitHub + локальные
#      overlay-модули), устанавливаемые/переводимые ВНУТРИ VM (skills.in_vm),
#      + кастомные скилл-модули loki поверх встроенных.
#   2. ОРКЕСТРАЦИЮ: loki с provider cline на модели GLM (z.ai), суженный SDLC
#      (effort: standard), кастомные гейты, кросс-проектная память.
#   3. СРЕДУ: stock debian VM, allowlist-сеть (только z.ai + npm + pypi),
#      результат в примонтированном src/.
#
# Поток данных:
#   platform.yaml
#     │  microcode apply
#     ├─ skills (in VM): msb exec ... skillkit install obra/superpowers ...
#     │                  + translate → cline SKILL.md в skills/
#     ├─ overlay модули: ./custom-skills → /workspace/skills (mount)
#     ├─ sandbox:        msb create debian + bootstrap.sh (node/loki/cline/shim)
#     └─ loki (in VM):   loki --provider cline --model glm-5.2 PRD.md
#                          читает skills/00-index.md (наш overlay)
#                          → строит сервис в /workspace (виден на хосте как src/)
#
# Запуск:
#   export ZAI_BUSINESS_BASE_URL="https://api.z.ai" \
#          ZAI_OAUTH_ORIGIN="https://chat.z.ai" \
#          ZAI_OAUTH_CLIENT_ID="client_..."   # (см. README, не в манифесте!)
#   microcode apply examples/cline-multi-skills/platform.yaml

version: 1

project:
  name: notes-api
  workdir: /workspace
  state_dir: .microcode

# ───────────────────────────────────────────────────────────────────────── #
# SKILLS — навыки из РАЗНЫХ провайдеров, устанавливаемые ВНУТРИ VM.         #
# ───────────────────────────────────────────────────────────────────────── #
skills:
  in_vm: true                         # skillkit бежит внутри VM (после bootstrap),
                                     # не на хосте — единое окружение с loki.
  agents: [cline]                    # фиксированный набор = провайдеры loki 1:1.

  # (1) GitHub-source: публичный репо скиллов (obra/superpowers).
  #     skillkit клонирует/тянет нужные скиллы и переводит под cline.
  install:
    - source: obra/superpowers
      skills:
        - test-driven-development    # RED-GREEN-REFACTOR
        - systematic-debugging       # 4-фазный root-cause перед фиксом
        - verification-before-completion  # пруфы готовности
        - writing-plans              # bite-sized план
        - executing-plans            # пошаговая реализация

  # (2) Локальные overlay-модули loki (не через skillkit) монтируются отдельно
  #     в sandbox.mounts ниже (./custom-skills → /workspace/skills). Они
  #     дополняют/переопределяют встроенные модули loki: 00-index.md +
  #     tdd-rules.md + security-checks.md + api-contract-rules.md.

  translate:
    target_agent: cline              # все скиллы переводятся под формат cline
    output_dir: .skills-generated    # отдельная папка (не конфликтует с overlay /workspace/skills)
    also_into_memory: true           # зеркалим SKILL.md в .loki/memory/skills/

# ───────────────────────────────────────────────────────────────────────── #
# LOKI — оркестрация: cline + GLM, суженный SDLC, кастомные гейты.          #
# ───────────────────────────────────────────────────────────────────────── #
loki:
  provider: cline                    # loki вызывает cline CLI (node-shim в VM)
  model: glm-5.2                     # модель z.ai (→ CLINE_MODEL + LOKI_MODEL_OVERRIDE)
  max_iterations: 15
  max_budget_usd: 5.0
  effort: standard                   # 6 фаз SDLC (без DEEPEN_PLAN можно low)
  # dashboard отключён: он ставит fastapi/uvicorn/sqlalchemy/aiosqlite из PyPI,
  # а pypi.org/files.pythonhosted.org нужно добавлять в allowlist + пересобирать
  # snapshot. RARV-цикл идёт и без web-UI; прогресс — `microcode status`.
  # Чтобы включить: раскомментировать + добавить pypi-хосты в allowlist + build.
  dashboard: false
  sdk_mode: full
  quality_gates:
    enabled: true
    opt_out:
      - magic_debate                 # нет UI — Gate 8 не нужен
  memory:
    enabled: true
    managed: true
    storage:                         # кросс-проектная память (volume)
      # enabled: true
      volume: loki-memory
      dest: /data/loki-memory
  proofs:
    enabled: true                    # evidence-receipts в .loki/proofs/
  provider_clis: [cline]             # bootstrap ставит только cline (+ shim)
  config_overrides:
    # стартуем со стадии разработки (PRD уже готов, design тривиален)
    start_phase: DEVELOPMENT

# ───────────────────────────────────────────────────────────────────────── #
# SANDBOX — stock debian, allowlist-сеть, overlay skills, результат в src/. #
# ───────────────────────────────────────────────────────────────────────── #
sandbox:
  image: debian
  tag: bookworm-slim
  name: notes-build
  cpus: 4
  memory: 4096
  root_disk: 8G

  network:
    # allowlist: запрет по умолчанию. VM ходит только к явно разрешённым хостам.
    # cline/node-shim использует zai-coding-plan OAuth → нужен api.z.ai.
    mode: allowlist
    default_egress: deny
    allow:
      # LLM-провайдер (z.ai / GLM) — OAuth endpoint cline
      - { action: allow, target: api.z.ai, proto: tcp, port: 443 }
      - { action: allow, target: "*.z.ai", proto: tcp, port: 443 }
      # apt (bootstrap ставит пакеты)
      - { action: allow, target: deb.debian.org, proto: tcp, port: 443 }
      - { action: allow, target: "*.debian.org", proto: tcp, port: 443 }
      - { action: allow, target: "*.debian.org", proto: tcp, port: 80 }
      # npm (node, loki-mode, cline, @cline/core)
      - { action: allow, target: registry.npmjs.org, proto: tcp, port: 443 }
      - { action: allow, target: bun.sh, proto: tcp, port: 443 }
      # PyPI (loki dashboard ставит fastapi/uvicorn/sqlalchemy/aiosqlite в venv;
      # без этих хостов pip падает "No matching distribution found for fastapi")
      - { action: allow, target: pypi.org, proto: tcp, port: 443 }
      - { action: allow, target: files.pythonhosted.org, proto: tcp, port: 443 }
      # GitHub (skillkit тянет obra/superpowers; git clone)
      - { action: allow, target: github.com, proto: tcp, port: 443 }
      - { action: allow, target: codeload.github.com, proto: tcp, port: 443 }
      - { action: allow, target: release-assets.githubusercontent.com, proto: tcp, port: 443 }
      # node tarball (bootstrap качает node)
      - { action: allow, target: nodejs.org, proto: tcp, port: 443 }
      # Go modules (PRD-001 требует Go-сервис; go get/tidy тянут зависимости отсюда)
      - { action: allow, target: proxy.golang.org, proto: tcp, port: 443 }
      - { action: allow, target: "*.golang.org", proto: tcp, port: 443 }
      - { action: allow, target: sum.golang.org, proto: tcp, port: 443 }
      # GCS-bucket proxy-golang-org fallback: некоторые модули (напр.
      # github.com/cloudflare/circl через ProtonMail/go-crypto → go-git/v5,
      # зависимость самого tg) отдаются только отсюда, не из кэша proxy.golang.org.
      - { action: allow, target: storage.googleapis.com, proto: tcp, port: 443 }
      - { action: allow, target: "*.googleapis.com", proto: tcp, port: 443 }
      - { action: allow, target: "*.pkg.go.dev", proto: tcp, port: 443 }
      # Go toolchain download (bootstrap ставит актуальный Go — apt даёт лишь 1.19,
      # а github.com/seniorGolang/tg/v2 требует go 1.26).
      - { action: allow, target: go.dev, proto: tcp, port: 443 }
      - { action: allow, target: dl.google.com, proto: tcp, port: 443 }
      - { action: allow, target: 1.1.1.1, proto: tcp, port: 53 }
      - { action: allow, target: 8.8.8.8, proto: tcp, port: 53 }
    # Альтернативные DNS: хост-резолверы иногда не резолвят bun.sh и др.
    # Пиним надёжные upstream-резолверы (микросандбокс форвардит туда DNS).
    dns:
      nameservers: [1.1.1.1, 8.8.8.8]
      query_timeout_ms: 3000

  init:
    packages:
      # NOTE: golang-go из apt = Go 1.19 — слишком стар для
      # github.com/seniorGolang/tg/v3 (требует go 1.26). Актуальный toolchain +
      # tg CLI v3 + плагин генерации транспорта tgp-go ставим в extra_shell.
      apt: [curl, git, ca-certificates, python3, python3-pip, python3-venv, unzip]
      npm_global: [loki-mode, skillkit]
      bun_global: [skillkit]
      # Окружение для PRD-001 (Go-сервис на github.com/seniorGolang/tg/v3):
      #   1. Go toolchain 1.26.x (с go.dev внутри VM; go.dev/dl.google.com в allowlist)
      #   2. tg v3 CLI: go install github.com/seniorGolang/tg/v3/cmd/tg@latest
      #   3. плагин генерации транспорта: tg pkg add https://github.com/seniorGolang/tgp-go
      #      (tgp-go даёт плагины server(Fiber)/client-go/client-ts/swagger;
      #       транспорт достраивается через `go generate ./...` — wazero WASM runtime)
      #   4. встроенные agent skills: tg skills install
      extra_shell: |
        set -e
        echo '[bootstrap] Go toolchain (go.dev, 1.26.x)'
        GO_VER="1.26.5"
        ARCH="$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/')"
        curl -fsSL "https://go.dev/dl/go${GO_VER}.linux-${ARCH}.tar.gz" -o /tmp/go.tgz \
          || curl -fsSL "https://dl.google.com/go/go${GO_VER}.linux-${ARCH}.tar.gz" -o /tmp/go.tgz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf /tmp/go.tgz
        rm -f /tmp/go.tgz
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
        /usr/local/go/bin/go version

        echo '[bootstrap] tg v3 CLI + transport plugin (tgp-go)'
        export PATH="/usr/local/go/bin:$PATH"
        export GOPATH="${GOPATH:-/root/go}"
        # Build tg from source (git clone + go build) instead of `go install`:
        # - pins the exact version (v3.0.5 tag, not @latest surprise)
        # - lets us apply the download race-condition patch UP FRONT (the stock
        #   binary deterministically hits `Failed to extract archive ...-skills.tar.gz:
        #   EOF` under the microsandbox network layer), so tg pkg add works on the
        #   first try instead of needing a rebuild-after-failure fallback.
        # See test-todo2/custom-skills/tg-patch/README.md for the root-cause analysis.
        TG_TAG="v3.0.5"
        rm -rf /tmp/tgsrc
        git clone --depth 1 --branch "$TG_TAG" https://github.com/seniorGolang/tg /tmp/tgsrc
        # Apply the committed race-condition fix: drop the `default:` arm in
        # downloadWithProgress that returns before close(progress) flushes the
        # downloaded file → extractArchive hits EOF.
        if [ -f /workspace/skills/tg-patch/install.go.patched ]; then
          cp /workspace/skills/tg-patch/install.go.patched \
             /tmp/tgsrc/internal/installer/managers/installation/install.go
          echo '[bootstrap] applied tg download race-condition patch'
        else
          echo '[bootstrap] WARN: install.go.patched not found; building stock tg'
        fi
        ( cd /tmp/tgsrc && CGO_ENABLED=0 go build -o /usr/local/bin/tg ./cmd/tg )
        rm -rf /tmp/tgsrc
        chmod +x /usr/local/bin/tg
        tg --version 2>/dev/null || true
        # transport-codegen plugins (WASM, built via wazero — slow first build).
        # Install ONLY what this project needs: astg (the @tg parser, required)
        # and server (Fiber server generator). NB: a bare `tg pkg add <repo>`
        # tries to build ALL 10 plugins and hangs; the :<name> suffix selects
        # one, and --fail-on-missing makes it non-interactive.
        mkdir -p /root/.agents
        tg_install_plugins() {
          HOME=/root tg pkg add https://github.com/seniorGolang/tgp-go:astg   --fail-on-missing && \
          HOME=/root tg pkg add https://github.com/seniorGolang/tgp-go:server --fail-on-missing
        }
        tg_install_plugins || echo "[bootstrap] WARN: tg plugins still failed"
        # The agent runs as the unprivileged `loki` user. tg plugins live under
        # /root/.tg (HOME-scoped). Mirror them for loki so `tg server` /
        # `tg client-go` work in the loki session too.
        for tgt in /home/loki/.tg /home/loki/.agents; do
          src="/root${tgt#/home/loki}"
          if [ -e "$src" ]; then cp -a "$src" "$tgt"; fi
        done
        chown -R loki:loki /home/loki/.tg /home/loki/.agents 2>/dev/null || true

        # --- git-daemon: read-only server exposing /workspace on :9418 ---
        # Lets the host pull loki's work (vm/<sandbox> branch) without msb cp:
        #   git fetch git://localhost:9418/ vm/<name>   (run on the host)
        # --export-all: serve repos without a git-daemon-export-ok marker.
        # --listen=0.0.0.0: REQUIRED — msb port-forward reaches the VM on eth0,
        #   not loopback; binding 127.0.0.1 makes the daemon look up but every
        #   host fetch hangs (same lesson as the notes-API on :8000).
        # Started as loki (owns /workspace); harmless if /workspace is not yet a repo.
        runuser -u loki -- bash -c '
          cd /workspace 2>/dev/null || exit 0
          nohup git daemon --reuseaddr --base-path=/workspace --export-all \
                   --listen=0.0.0.0 --port=9418 >/tmp/git-daemon.log 2>&1 &
        ' || true
    snapshot:
      # --- APPLY mode (active): boot from the pre-built snapshot ---
      # from_snapshot: mcd-base
      # --- BUILD mode: set enabled: true (and comment from_snapshot) to recapture ---
      enabled: true
      name: mcd-base

  mounts:
    # (A) overlay скилл-модули loki — ДОПОЛНЯТ/ПЕРЕОПРЕДЕЛЯЮТ встроенные.
    #     loki читает /workspace/skills/00-index.md → грузит наши модули по фазе.
    - { host: ./custom-skills, dest: /workspace/skills, readonly: false }
    # (B) рабочая директория ./src → /workspace ПОДАВЛЯЕТСЯ при sandbox.sync
    #     (ниже): workspace клонируется из remote, а не bind-mount'ится.
    #     Оставлено как fallback (когда sync.enabled=false).
    - { host: ./src, dest: /workspace, readonly: false }

  ports:
    - "8000:8000"                    # notes-API будет слушать тут
    - "9418:9418"                    # git-daemon (read-only): host pulls loki result via git://localhost:9418/

  # --- git-clone workspace provisioning: microcode клонирует remote в /workspace
  #     при build/apply (вместо bind-mount ./src / tar-seed). Mount для
  #     sync.dest (/workspace) подавляется автоматически; git-хост
  #     auto-allowlisted для egress. Loki получает shared git history → коммитит
  #     на vm/<sandbox>, host забирает через git-daemon :9418 или git fetch.
  #     Credentials резолвятся host-side (never inlined). На хосте перед apply:
  #       export GH_TOKEN=ghp_...        # PAT с read-доступом к репо
  #     Remote = приватный форк microcode (или исходный sah4ez/microcode.git).
  sync:
    enabled: true
    remote_url: "https://github.com/sah4ez/microcode.git"
    branch: master
    dest: /workspace
    auth:
      method: https
      token_env: GH_TOKEN            # host env var с PAT (never inlined в манифест)
    depth: 1                         # shallow clone (loki не нужна полная история)
