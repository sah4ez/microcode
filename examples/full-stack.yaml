version: 1

project:
  name: full-stack-app
  workdir: /workspace
  state_dir: .microcode

skills:
  registry:
    sources: [anthropics/skills]
    taps: [myorg/internal-skills]
  install:
    - source: anthropics/skills
      skills: [code-review, testing]
      agents: [claude-code]
    - source: myorg/internal-skills
      skills: [deploy-patterns]
      provider: github
      agents: [claude-code]
  translate:
    target_agent: claude-code
    output_dir: skills
    also_into_memory: true
    force: true

loki:
  provider: claude
  max_iterations: 30
  max_budget_usd: 25.0
  effort: high
  sdk_mode: full
  quality_gates:
    enabled: true
    opt_out: []
  memory:
    enabled: true
    managed: true
    # external persistent memory: loki writes its learnings store to a mounted
    # named volume, so cross-project memory survives VM destroy/recreate.
    storage:
      enabled: true
      volume: loki-memory
      dest: /data/loki-memory
  proofs:
    enabled: true
  provider_clis: [claude]
  config_overrides:
    parallel: true

sandbox:
  image: debian
  tag: bookworm-slim
  name: loki-build
  cpus: 4
  memory: 4096
  max_cpus: 8
  max_memory: 16384
  network:
    # denylist mode: allow-by-default, but block specific bad destinations.
    mode: denylist
    profile: [public, host]
    default_egress: allow
    deny:
      - { action: deny, target: 10.0.0.0/8 }             # block private CIDR
      - { action: deny, target: malicious.example.com }  # block a domain
    deny_domain_suffixes:
      - ads.example.com                                  # block *.ads.example.com
  init:
    packages:
      apt: [curl, git, ca-certificates, python3, python3-pip, python3-venv, jq, procps]
      npm_global: [loki-mode, "@skillkit/cli", "@anthropic-ai/claude-code"]
      bun: true
      node_version: "22"
      extra_shell: |
        # custom team tooling
        pip install --break-system-packages ruff mypy
    snapshot:
      enabled: true
      name: loki-prepared
  secrets:
    - env: ANTHROPIC_API_KEY
      allow_hosts: [api.anthropic.com]
    - env: GITHUB_TOKEN
      allow_hosts: [api.github.com, github.com]
  volumes:
    - name: loki-data
      dest: /data
      kind: dir
  mounts:
    - host: ./src
      dest: /workspace
      readonly: false
  ports: [57374:57374, 8080:8080]
  env:
    NODE_ENV: development
